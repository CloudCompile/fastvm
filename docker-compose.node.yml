services:
  node-server:
    image: node:22-bookworm-slim
    container_name: ${FASTVM_NODE_SERVER_NAME:-fastvm-node-server}
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FASTVM_NODE_SERVER_PORT:-3002}
      HOST: ${FASTVM_NODE_SERVER_HOST:-0.0.0.0}
      FASTVM_NODE_SERVER_COMMAND: ${FASTVM_NODE_SERVER_COMMAND:-npm start}
    command:
      - sh
      - -c
      - >-
        if [ -f package.json ] && [ ! -d node_modules ]; then
          npm install --omit=dev --no-audit --no-fund;
        fi;
        exec sh -c "$$FASTVM_NODE_SERVER_COMMAND"
    ports:
      - "${FASTVM_NODE_SERVER_BIND_IP:-127.0.0.1}:${FASTVM_NODE_SERVER_HOST_PORT:-3002}:${FASTVM_NODE_SERVER_PORT:-3002}"
    volumes:
      - ./data/node-app:/app
    restart: unless-stopped
