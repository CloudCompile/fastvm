name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.optimized
          ignore: DL3008,DL3003,SC2015
          failure-threshold: error

  validate-json:
    name: Validate options.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check options.json is valid JSON
        run: python3 -m json.tool options.json > /dev/null

  validate-bundles:
    name: Validate app bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle resolution produces the expected apps
        run: |
          set -euo pipefail
          check() {
            local label="$1" expected="$2"; shift 2
            got="$(python3 scripts/render-options-json.py /dev/null /dev/stdout "$@" 2>/dev/null \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["bundle"],d["defaultapps"],d["programming"],d["apps"])')"
            if [[ "$got" != "$expected" ]]; then
              echo "FAIL $label"; echo "  expected: $expected"; echo "  got:      $got"; exit 1
            fi
            echo "ok $label -> $got"
          }
          # XFCE4 default: essentials = chrome(1) + xarchiver(2) + vlc(apps 0)
          check "xfce4/none" "essentials [1, 2] [] [0]" --desktop xfce4 --preset none
          # Minimal WM default: browser = chrome(1)
          check "i3/none" "browser [1] [] []" --desktop i3 --preset none
          # Preset bundle overrides desktop default
          check "kde/gaming" "gaming [0, 1, 3, 4, 5] [1] [4, 5, 6, 7]" --desktop kde --preset gaming
          check "gnome/office" "office [1, 2] [] [1]" --desktop gnome --preset office
          # Single-app images must never pick up a bundle
          got="$(FASTVM_SINGLEAPP_SCRIPT=discord-only.sh python3 scripts/render-options-json.py /dev/null /dev/stdout --desktop singleapp --preset none 2>/dev/null \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["bundle"],d["defaultapps"],d["apps"])')"
          [[ "$got" == "none [] []" ]] || { echo "FAIL singleapp -> $got"; exit 1; }
          echo "ok singleapp -> $got"
      - name: Dockerfile generates options.json from build args
        run: |
          set -euo pipefail
          grep -q 'render-options-json.py /dev/null /options.json' Dockerfile.optimized
          grep -q 'FASTVM_APP_BUNDLE' Dockerfile.optimized
      - name: Bundle config surface is documented
        run: |
          set -euo pipefail
          grep -q 'FASTVM_APP_BUNDLE' config.env
          grep -q 'FASTVM_APP_BUNDLE' config.env.example
          grep -q 'FASTVM_APP_BUNDLE' scripts/validate-config.sh
          grep -q 'docs/app-bundles.md' CLAUDE.md
          grep -q 'webcam' docs/roadmap.md

  validate-perf-profile:
    name: Validate performance profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check
        run: bash -n scripts/perf-profile.sh scripts/gpu-session-env.sh
      - name: Classifies a 2-core / 8 GB no-GPU host as constrained
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export FASTVM_DATA_ROOT="$tmp" FASTVM_PERF_FORCE_CPUS=2 FASTVM_PERF_FORCE_MEM_MB=8192
          json="$(bash scripts/perf-profile.sh json)"
          echo "$json"
          grep -q '"profile":"constrained"' <<<"$json"
          grep -q '"compositing_off":true' <<<"$json"
          grep -q '"raster_threads":2' <<<"$json"
          grep -q '"encode_threads":1' <<<"$json"
      - name: Clamps llvmpipe to the vCPU count and frees a core for the encoder
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          env_out="$(FASTVM_DATA_ROOT="$tmp" FASTVM_PERF_FORCE_CPUS=2 FASTVM_PERF_FORCE_MEM_MB=8192 \
            bash scripts/perf-profile.sh env)"
          echo "$env_out"
          grep -q '^LIBGL_ALWAYS_SOFTWARE=1$' <<<"$env_out"
          grep -q '^GALLIUM_DRIVER=llvmpipe$' <<<"$env_out"
          grep -q '^LP_NUM_THREADS=2$' <<<"$env_out"
          grep -q '^FASTVM_PERF_ENCODE_THREADS=1$' <<<"$env_out"
          # A bigger host leaves llvmpipe and the encoder at defaults.
          big="$(FASTVM_DATA_ROOT="$tmp" FASTVM_PERF_FORCE_CPUS=8 FASTVM_PERF_FORCE_MEM_MB=32768 \
            bash scripts/perf-profile.sh env)"
          [[ -z "$big" ]] || { echo "expected no overrides on a large host; got: $big"; exit 1; }
      - name: A graphics GPU is never forced onto the software path
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # A constrained host that nonetheless has a graphics GPU: no
          # software-render overrides, and compositing is left alone. (The
          # software-recorder thread budget is still emitted, harmlessly.)
          env_out="$(FASTVM_DATA_ROOT="$tmp" FASTVM_PERF_FORCE_CPUS=2 FASTVM_PERF_FORCE_MEM_MB=8192 \
            FASTVM_PERF_FORCE_GPU_KIND=graphics bash scripts/perf-profile.sh env)"
          ! grep -q '^LIBGL_ALWAYS_SOFTWARE=' <<<"$env_out"
          ! grep -q '^LP_NUM_THREADS=' <<<"$env_out"
          ! grep -q '^GALLIUM_DRIVER=' <<<"$env_out"
          json="$(FASTVM_DATA_ROOT="$tmp" FASTVM_PERF_FORCE_CPUS=2 FASTVM_PERF_FORCE_MEM_MB=8192 \
            FASTVM_PERF_FORCE_GPU_KIND=graphics bash scripts/perf-profile.sh json)"
          grep -q '"gpu_kind":"graphics"' <<<"$json"
          grep -q '"compositing_off":false' <<<"$json"
      - name: Config surface is documented and validated
        run: |
          set -euo pipefail
          grep -q 'FASTVM_PERF_PROFILE' config.env
          grep -q 'FASTVM_PERF_PROFILE' config.env.example
          grep -q 'FASTVM_PERF_PROFILE' scripts/validate-config.sh
          grep -q 'FASTVM_PERF_PROFILE' docker-compose.yml
          grep -q 'perf-profile.sh' root/etc/cont-init.d/99-fastvm-init
          grep -q 'perf-profile.sh' scripts/gpu-session-env.sh
      - name: Recorder honours the encode-thread budget
        run: |
          set -euo pipefail
          grep -q 'FASTVM_PERF_ENCODE_THREADS' scripts/screen-recorder.sh
          grep -q 'sw_threads' scripts/screen-recorder.sh

  validate-codespaces:
    name: Validate Codespaces setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the installer
        run: bash -n fastvm-install.sh
      - name: Installer help lists the fast paths
        run: |
          set -euo pipefail
          ./fastvm-install.sh --help | grep -q -- '--pull'
          ./fastvm-install.sh --help | grep -q -- '--no-build'
          ./fastvm-install.sh --help | grep -q -- '--print-image'
      - name: Derives the published image tag for a desktop/preset
        run: |
          set -euo pipefail
          cfg="$(mktemp)"
          printf 'FASTVM_DE=KDE\nFASTVM_PRESET=none\n' > "$cfg"
          ref="$(FASTVM_CONFIG="$cfg" ./fastvm-install.sh --print-image | tail -1)"
          echo "$ref"
          [[ "$ref" == "ghcr.io/cloudcompile/fastvm:kde-none-latest" ]]
      - name: devcontainer.json is valid and wired to the prebuilt image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          src = open('.devcontainer/devcontainer.json').read()
          stripped = "\n".join(l for l in src.splitlines() if not l.lstrip().startswith('//'))
          cfg = json.loads(re.sub(r'//.*', '', stripped))
          assert cfg['features']['ghcr.io/devcontainers/features/docker-in-docker:2']
          assert 3000 in cfg['forwardPorts'] and 3001 in cfg['forwardPorts']
          assert cfg['hostRequirements']['cpus'] == 2  # keep the free tier creatable
          assert 'xfce4-none-latest' in cfg['containerEnv']['FASTVM_IMAGE']
          assert 'docker pull' in cfg['onCreateCommand']       # cached by prebuilds
          assert '--no-build' in cfg['postCreateCommand']
          assert 'docker compose up' in cfg['postStartCommand']
          assert '--no-recreate' in cfg['postStartCommand']  # resume must not clobber config.env
          print('devcontainer.json ok')
          PY
      - name: The derived image tag exists in the registry
        run: |
          set -euo pipefail
          ref="$(./fastvm-install.sh --print-image | tail -1)"
          tag="${ref##*:}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:cloudcompile/fastvm:pull&service=ghcr.io" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')"
          curl -fsS -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/cloudcompile/fastvm/tags/list" \
            | python3 -c "import sys,json;t=set(json.load(sys.stdin)['tags']);sys.exit(0 if '$tag' in t else 1)"
          echo "$ref is published"

      - name: Environment report detects Codespaces and warns about limits
        run: |
          set -euo pipefail
          bash -n scripts/env-report.sh
          out="$(CODESPACES=true FASTVM_DATA_ROOT="$(mktemp -d)" bash scripts/env-report.sh json)"
          echo "$out"
          python3 - "$out" <<'PY'
          import json, sys
          env = json.loads(sys.argv[1])
          assert env['kind'] == 'codespaces', env['kind']
          ids = {n['id'] for n in env['notices']}
          assert 'codespaces' in ids and 'no-kvm' in ids, ids
          assert isinstance(env['disk_free_mb'], int)
          PY

  validate-discord-tuning:
    name: Validate Discord tuning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check
        run: bash -n scripts/discord-tune.sh root/startwm-singleapp.sh
      - name: Flags adapt to the machine (no GPU)
        run: |
          set -euo pipefail
          # A 2-core / 8 GB CPU-only box must not enable the GPU stack and must
          # clamp the raster threads to the CPU budget.
          out="$(bash -c 'source <(sed "/^main \"\$@\"/d" scripts/discord-tune.sh); build_flags 2 none')"
          echo "$out"
          grep -q -- '--disable-gpu' <<<"$out"
          grep -q -- '--num-raster-threads=1' <<<"$out"
          grep -q -- '--renderer-process-limit=2' <<<"$out"
          # --disable-dev-shm-usage is added only when /dev/shm is small. Force
          # both branches so this does not depend on the runner's tmpfs size.
          small="$(bash -c 'FASTVM_SHM_FORCE_MB=256; source <(sed "/^main \"\$@\"/d" scripts/discord-tune.sh); build_flags 2 none')"
          big="$(bash -c 'FASTVM_SHM_FORCE_MB=4096; source <(sed "/^main \"\$@\"/d" scripts/discord-tune.sh); build_flags 2 none')"
          grep -q -- '--disable-dev-shm-usage' <<<"$small"
          ! grep -q -- '--disable-dev-shm-usage' <<<"$big"
          # Chromium only honours the last --enable-features, so there must be
          # exactly one and it must carry the voice features.
          [[ "$(grep -o -- '--enable-features' <<<"$out" | wc -l)" -eq 1 ]]
          grep -q 'WebRtcAllowInputVolumeAdjustment' <<<"$out"
          ! grep -q 'VaapiVideoDecoder' <<<"$out"
      - name: Flags enable hardware decode with a graphics GPU
        run: |
          set -euo pipefail
          out="$(bash -c 'source <(sed "/^main \"\$@\"/d" scripts/discord-tune.sh); build_flags 4 graphics')"
          echo "$out"
          grep -q 'VaapiVideoDecoder' <<<"$out"
          ! grep -q -- '--disable-gpu' <<<"$out"
      - name: Session augments discord autostart
        run: |
          set -euo pipefail
          grep -q 'discord-tune.sh flags' root/startwm-singleapp.sh
          grep -q 'discord-tune.sh report' root/startwm-singleapp.sh

  validate-dashboard:
    name: Validate dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm test

  validate-audio:
    name: Validate audio setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every desktop starter initializes audio
        run: |
          set -euo pipefail
          for starter in root/startwm-*.sh; do
            bash -n "$starter"
          done
          grep -q 'baseimage-kasmvnc' Dockerfile.optimized
          grep -q 'base image' scripts/audio-init.sh
          bash -n scripts/audio-init.sh scripts/audio-self-test.sh

  validate-gpu:
    name: Validate GPU support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check GPU scripts
        run: bash -n scripts/gpu-detect.sh scripts/gpu-self-test.sh scripts/gpu-session-env.sh scripts/screen-recorder.sh
      - name: Validate GPU compose overlays
        run: |
          python3 - <<'PY'
          import yaml
          for f in ("docker-compose.gpu.yml", "docker-compose.gpu-nvidia.yml"):
              yaml.safe_load(open(f))
          PY
      - name: Check GPU config surface is documented
        run: |
          set -euo pipefail
          grep -q 'FASTVM_RECORDING_ENCODER' config.env.example
          grep -q 'FASTVM_RECORDING_ENCODER' scripts/validate-config.sh
          grep -q 'FASTVM_GPU_HW' scripts/validate-config.sh
          grep -q 'docker-compose.gpu.yml' docs/gpu.md
      - name: Compute-only GPU detection (fixture)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export FASTVM_DATA_ROOT="$tmp"
          mkdir -p "$tmp/.fastvm" "$tmp/dev/dri"
          : > "$tmp/dev/dri/renderD128"
          # AMD render node with no KMS card node => compute-only accelerator.
          FASTVM_GPU_FORCE_RENDER_NODE="$tmp/dev/dri/renderD128" \
            FASTVM_GPU_FORCE_CARD="" \
            FASTVM_GPU_FORCE_VENDOR=amd \
            bash scripts/gpu-detect.sh detect
          bash scripts/gpu-detect.sh show | grep -q '"compute_only": true'
          bash scripts/gpu-detect.sh show | grep -q '"recommended_encoder": "software"'
          # With a KMS card node present it is a graphics GPU: not compute-only.
          : > "$tmp/dev/dri/card0"
          FASTVM_GPU_FORCE_RENDER_NODE="$tmp/dev/dri/renderD128" \
            FASTVM_GPU_FORCE_CARD="$tmp/dev/dri/card0" \
            FASTVM_GPU_FORCE_VENDOR=amd \
            bash scripts/gpu-detect.sh detect
          bash scripts/gpu-detect.sh show | grep -q '"compute_only": false'
