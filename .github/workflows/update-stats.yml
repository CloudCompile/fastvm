name: Update README Stats

on:
  workflow_run:
    workflows: ["Build and Publish FastVM Images"]
    types:
      - completed
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate stats from build logs
        id: stats
        run: |
          set -euo pipefail
          REPOSITORY="${GITHUB_REPOSITORY}"

          # Real metric: successful workflow runs for the image build pipeline.
          SUCCESSFUL_BUILDS=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow build-images.yml \
            --status success \
            --limit 1000 \
            --json conclusion --jq 'length')

          # Real metric: image variants defined by the workflow matrices.
          # 21 desktops x 6 presets = 126 + 4 single-app builds + 1 OS appliance
          # + 6 Ubuntu flavors (Studio, Kylin, Budgie, Edubuntu, Xubuntu,
          # Lubuntu) = 137.
          PUBLISHED_IMAGE_VARIANTS=137

          # Real metric: total Git commits in the default branch.
          TOTAL_COMMITS=$(git rev-list --count HEAD)

          echo "successful_builds=$SUCCESSFUL_BUILDS" >> $GITHUB_OUTPUT
          echo "published_image_variants=$PUBLISHED_IMAGE_VARIANTS" >> $GITHUB_OUTPUT
          echo "total_commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with real stats
        run: |
          python3 - <<'PYEOF'
          import os

          builds = os.environ["SUCCESSFUL_BUILDS"]
          images = os.environ["PUBLISHED_IMAGE_VARIANTS"]
          commits = os.environ["TOTAL_COMMITS"]
          updated = os.environ["BUILD_DATE"]

          new_block = f"""## 📊 **Real-Time Stats**

            ```text
            ✅ Successful Builds:     {builds}+
            📦 Published Image Variants: {images}
            📝 Total Commits:         {commits}
            🕐 Last Updated:          {updated}
            ```

            **These are real metrics** — updated every hour from actual GitHub Actions and repository data."""

          with open("README.md", "r") as f:
              content = f.read()

          start = content.index("## 📊 **Real-Time Stats**")
          end = content.index("**These are real metrics**") + len("**These are real metrics**")
          new_content = content[:start] + new_block + content[end:]

          if new_content == content:
              raise SystemExit("README stats section was not found; refusing to write unchanged content")

          with open("README.md", "w") as f:
              f.write(new_content)

          print("README updated successfully")
          PYEOF
        env:
          SUCCESSFUL_BUILDS: ${{ steps.stats.outputs.successful_builds }}
          PUBLISHED_IMAGE_VARIANTS: ${{ steps.stats.outputs.published_image_variants }}
          TOTAL_COMMITS: ${{ steps.stats.outputs.total_commits }}
          BUILD_DATE: ${{ steps.stats.outputs.build_date }}

      - name: Commit stats update
        env:
          SUCCESSFUL_BUILDS: ${{ steps.stats.outputs.successful_builds }}
          PUBLISHED_IMAGE_VARIANTS: ${{ steps.stats.outputs.published_image_variants }}
          TOTAL_COMMITS: ${{ steps.stats.outputs.total_commits }}
          BUILD_DATE: ${{ steps.stats.outputs.build_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes to commit"
            exit 0
          fi

          git add README.md
          git commit -m "stats: Update README with real CI/CD metrics [skip ci]"
          git push

      - name: Print stats summary
        run: |
          echo "Total successful builds: ${{ steps.stats.outputs.successful_builds }}"
          echo "Published image variants: ${{ steps.stats.outputs.published_image_variants }}"
          echo "Total commits: ${{ steps.stats.outputs.total_commits }}"
