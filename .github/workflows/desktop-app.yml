name: Desktop App

on:
  push:
    branches: ["**"]
    paths:
      - "desktop-app/**"
      - "scripts/verify-catalog.js"
      - ".github/workflows/desktop-app.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "desktop-app/**"
      - "scripts/verify-catalog.js"
      - ".github/workflows/desktop-app.yml"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - name: Rust unit tests
        working-directory: desktop-app/src-tauri
        run: cargo test --verbose

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop-app dev dependencies
        working-directory: desktop-app
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Frontend tests (jsdom)
        working-directory: desktop-app
        run: npm run test:ui

      - name: Verify catalog matches the build matrix
        run: node scripts/verify-catalog.js

  build:
    name: Build bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Tauri CLI
        working-directory: desktop-app
        run: npm install

      - name: Build the app
        working-directory: desktop-app
        run: npm run build
