name: Build and Publish FastVM Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    name: Build shared FastVM base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.base.outputs.image }}
    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push shared base
        id: base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-latest
          labels: |
            org.opencontainers.image.title=FastVM shared base
            org.opencontainers.image.description=Desktop-neutral shared FastVM runtime base
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-base
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-base,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}

  build:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        desktop:
          - xfce4
          - kde
          - gnome
          - cinnamon
          - lxqt
          - i3
          - budgie
          - mate
          - lxde
          - fluxbox
          - unity
          - enlightenment
          - icewm
          - awesome
          - ukui
          - bspwm
          - gnome-flashback
          - wmaker
          - herbstluftwm
          - jwm
          - fvwm
          - xmonad
          - sugar
          - dwm
          - ratpoison
          - blackbox
          - pop-os
          - pekwm
          - spectrwm
          - sawfish
          - openbox
          - afterstep
          - ctwm
          - twm
          - nixos
          - pearos
        preset:
          - none
          - minimal
          - gaming
          - development
          - office
          - content-creation

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags for ${{ matrix.desktop }}-${{ matrix.preset }}
        id: tags
        run: |
          FULL_TAG="${{ matrix.desktop }}-${{ matrix.preset }}"

          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT

          TAGS="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:$FULL_TAG-latest"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS"$'\n'"${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:$FULL_TAG-$VERSION"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.desktop }}-${{ matrix.preset }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-preset
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FastVM ${{ matrix.desktop }}-${{ matrix.preset }}
            org.opencontainers.image.description=FastVM with ${{ matrix.desktop }} desktop + ${{ matrix.preset }} preset
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.desktop }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.desktop }},mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}
            FASTVM_DE=${{ matrix.desktop }}
            FASTVM_PRESET=${{ matrix.preset }}
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}

  build-specials:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser
            app_script: browser-only.sh
            autostart_cmd: google-chrome-stable --no-sandbox --disable-gpu-sandbox
            description: Chrome browser only, no desktop environment
          - name: discord
            app_script: discord-only.sh
            autostart_cmd: /usr/bin/discord --no-sandbox
            description: Discord only, no desktop environment
          - name: vscode
            app_script: vscode-only.sh
            autostart_cmd: codium --no-sandbox
            description: VSCodium only, no desktop environment
          - name: terminal
            app_script: terminal-only.sh
            autostart_cmd: xfce4-terminal
            description: Terminal only, no desktop environment

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags for ${{ matrix.name }}
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.name }}-latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="$TAGS"$'\n'"${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.name }}-${{ github.ref_name }}"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-preset
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FastVM ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-specials
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-specials,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}
            FASTVM_DE=singleapp
            FASTVM_PRESET=none
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}
            FASTVM_SINGLEAPP_CMD=${{ matrix.autostart_cmd }}
            FASTVM_SINGLEAPP_SCRIPT=${{ matrix.app_script }}

  build-fastvm-os:
    name: Build FastVM OS appliance
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push FastVM OS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-preset
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:fastvm-os-latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:fastvm-os-${{ github.sha }}
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}
            FASTVM_DE=fastvm-os
            FASTVM_PRESET=development
            FASTVM_OS_FLAVOR=fastvm-os
            FASTVM_BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:base-${{ github.sha }}

  # GPU-enabled variant: ships the VA-API/Mesa/Vulkan userspace drivers so the
  # same image can use hardware encode once device mapping is added at runtime
  # (see docs/gpu.md and docker-compose.gpu*.yml). Desktop functionality is
  # identical to the CPU image; acceleration is opt-in via the compose overlay.
  build-gpu:
    name: Build GPU-enabled image
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase image name
