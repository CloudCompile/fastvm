name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  config-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: bash scripts/validate-config.sh
      - name: Validate all Compose stacks
        run: bash scripts/validate-compose.sh

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm test

  base-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build shared FastVM base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-base
          push: false
          tags: fastvm-base:pr
          build-args: |
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            VERSION=pr-${{ github.event.pull_request.number }}

  representative-build:
    needs: base-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - desktop: xfce4
            preset: none
          - desktop: lxqt
            preset: minimal
          - desktop: kde
            preset: gaming
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-preset
          push: false
          tags: fastvm:${{ matrix.desktop }}-${{ matrix.preset }}
          build-args: |
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            VERSION=pr-${{ github.event.pull_request.number }}
            FASTVM_DE=${{ matrix.desktop }}
            FASTVM_PRESET=${{ matrix.preset }}
            FASTVM_BASE_IMAGE=fastvm-base:pr

  single-app-build:
    needs: base-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-preset
          push: false
          tags: fastvm:browser
          build-args: |
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
            VERSION=pr-${{ github.event.pull_request.number }}
            FASTVM_DE=singleapp
            FASTVM_PRESET=none
            FASTVM_SINGLEAPP_CMD=google-chrome-stable --no-sandbox
            FASTVM_SINGLEAPP_SCRIPT=browser-only.sh
            FASTVM_BASE_IMAGE=fastvm-base:pr

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: [base-build, representative-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastvm-preset
          load: true
          tags: fastvm:scan
          build-args: |
            FASTVM_DE=xfce4
            FASTVM_BASE_IMAGE=fastvm-base:pr
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: fastvm:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL
