<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FastVM Marketplace</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⚡</span> FastVM <span class="muted">Marketplace</span></div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search 236 desktops, distros, presets…" autocomplete="off" aria-label="Search the marketplace" />
    </div>
    <div class="statuses">
      <div class="status" id="gpu-status" title="Host graphics hardware">GPU…</div>
      <div class="status" id="docker-status" title="Docker daemon">Checking Docker…</div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Categories"></nav>

  <main class="layout">
    <section class="store">
      <div class="store-head">
        <span id="result-count" class="muted"></span>
      </div>
      <div class="grid" id="grid" role="list"></div>
      <p class="empty hidden" id="no-results">No apps match your search.</p>
    </section>

    <aside class="panel details" id="details" aria-live="polite">
      <div class="details-empty" id="details-empty">
        <div class="big">⚡</div>
        <p>Pick an app to see details and deploy it in one click.</p>
      </div>
      <div class="details-body hidden" id="details-body"></div>
    </aside>
  </main>

  <section class="instances-bar">
    <div class="instances-head">
      <h2>Running instances <span class="muted" id="instance-count"></span></h2>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <div class="instances-list" id="instances"></div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title">Logs</span><button class="ghost" id="modal-close">Close</button></div>
      <pre id="modal-body"></pre>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
