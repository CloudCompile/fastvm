# FastVM NVIDIA GPU overlay.
# Requests NVIDIA GPUs through the NVIDIA Container Toolkit (host prerequisite).
# Layer this on top of docker-compose.yml (and optionally docker-compose.gpu.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     -f docker-compose.gpu-nvidia.yml up -d
#
# Requires: nvidia-container-toolkit installed and `nvidia-ctk runtime configure`
# run on the host so Docker uses the nvidia runtime.
services:
  fastvm:
    # NVIDIA's closed driver has no DRI3, so KasmVNC's -hw3d is skipped (the base
    # image disables it when nvidia-smi is present). The render node is still
    # mapped so apps reach the GPU through Zink (OpenGL-over-Vulkan); the session
    # env for that is set by scripts/gpu-session-env.sh.
    devices:
      - /dev/dri:/dev/dri
    environment:
      # NVENC needs the video capability; compute covers CUDA/ML workloads and
      # graphics covers Zink/EGL.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,video,graphics,utility}
      - FASTVM_RECORDING_ENCODER=${FASTVM_RECORDING_ENCODER:-auto}
      - FASTVM_GPU_HW=${FASTVM_GPU_HW:-true}
      - FASTVM_GPU_KEEP_COMPOSITING=${FASTVM_GPU_KEEP_COMPOSITING:-false}
      - DRINODE=${DRINODE:-/dev/dri/renderD128}
    # !override: when stacked on docker-compose.gpu.yml (see header above),
    # Compose would otherwise concatenate both group_add lists and fail
    # validation with duplicate entries.
    group_add: !override
      - video
      - render
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${FASTVM_GPU_COUNT:-all}
              capabilities: [gpu, graphics, video, compute, utility]
